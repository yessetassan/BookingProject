version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: booking_db
    restart: always
    environment:
      POSTGRES_DB: booking_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 20112003b
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
